<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>ランナーズ・ライブ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 参加画面 -->
  <div id="joinScreen" class="join" hidden>
    <form id="joinForm" class="join-card">
      <h1>🏃 ランナーズ・ライブ</h1>
      <p class="muted">仲間の現在地・状態・チャットを地図でリアルタイムに共有します。</p>
      <div id="demoNoteJoin" class="demo-note" hidden>
        デモモードです（Firebase未設定）。ダミーのメンバーが動きます。データは保存されません。
      </div>
      <label>表示名
        <input id="joinName" name="name" maxlength="20" required placeholder="例：さとう" autocomplete="nickname">
      </label>
      <label>ルームコード（大会ごとに共通のコード）
        <div class="row">
          <input id="joinRoom" name="room" maxlength="32" required placeholder="例：fuji100-2026" pattern="[A-Za-z0-9_\-]{4,32}" autocapitalize="off" autocomplete="off">
          <button type="button" id="genRoom" class="btn-ghost">自動生成</button>
        </div>
        <small class="muted">半角英数字・-・_ で4〜32文字。同じコードの人だけが見えます。推測されにくいコードにしてください。</small>
      </label>
      <label>マーカーの色
        <div id="colorPicker" class="colors"></div>
      </label>
      <button type="submit" class="btn-primary big">参加する</button>
      <p id="joinError" class="error" hidden></p>
    </form>
  </div>

  <!-- メイン画面 -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">🏃 <span>ランナーズ・ライブ</span></div>
      <div class="room-chip" title="ルームコード">#<span id="roomLabel"></span></div>
      <span id="demoBadge" class="demo-badge" hidden>デモ</span>
      <span id="netBadge" class="net-badge" hidden>オフライン</span>
      <button id="menuBtn" class="icon-btn" aria-label="メニュー">☰</button>
    </header>

    <div id="alertBanner" class="alert-banner" hidden>
      <span id="alertText"></span>
      <button id="alertShow" class="btn-light">地図で見る</button>
      <button id="alertClose" class="icon-btn light" aria-label="閉じる">✕</button>
    </div>

    <main class="panes">
      <section id="pane-map" class="pane active">
        <div id="map"></div>
        <div class="map-overlay">
          <button id="sendPosBtn" class="btn-primary fab">📍 今の位置を送信</button>
          <div id="posInfo" class="pos-info"></div>
        </div>
        <div class="map-tools">
          <button id="fitAllBtn" class="map-btn" title="全員を表示">👥</button>
          <button id="fitCourseBtn" class="map-btn" title="コース全体を表示">🗺️</button>
          <button id="meBtn" class="map-btn" title="自分の位置">🎯</button>
        </div>
      </section>

      <section id="pane-side" class="pane-side">
        <div class="side-tabs">
          <button data-side="chat" class="active">チャット</button>
          <button data-side="members">メンバー</button>
        </div>
        <section id="pane-chat" class="pane">
          <ul id="messages" class="messages"></ul>
          <form id="chatForm" class="chat-form">
            <label class="icon-btn photo-btn" title="写真を投稿">📷
              <input id="photoInput" type="file" accept="image/*" hidden>
            </label>
            <input id="chatInput" maxlength="500" placeholder="メッセージ" autocomplete="off" enterkeyhint="send">
            <button class="btn-primary" type="submit">送信</button>
          </form>
        </section>
        <section id="pane-members" class="pane">
          <div id="courseSummary" class="course-summary"></div>
          <ul id="memberList" class="member-list"></ul>
        </section>
      </section>
    </main>

    <div class="statusbar">
      <div class="status-label">自分の状態</div>
      <div id="statusButtons" class="status-buttons"></div>
    </div>

    <nav class="tabbar">
      <button data-tab="map" class="active">🗺️<span>地図</span></button>
      <button data-tab="chat">💬<span>チャット</span><b id="unreadBadge" class="badge" hidden>0</b></button>
      <button data-tab="members">👥<span>メンバー</span></button>
    </nav>
  </div>

  <!-- メニュー -->
  <div id="menu" class="sheet" hidden>
    <div class="sheet-card">
      <h2>メニュー</h2>
      <div class="menu-me" id="menuMe"></div>
      <label class="menu-item">📂 コース（GPX）を読み込む
        <input id="gpxInput" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
      </label>
      <button id="clearCourseBtn" class="menu-item">🗑️ コースを削除</button>
      <button id="notifyBtn" class="menu-item">🔔 ブラウザ通知を許可</button>
      <label class="menu-item switch">☀️ 画面を消さない（バッテリー消費増）
        <input id="wakeToggle" type="checkbox">
      </label>
      <button id="copyLinkBtn" class="menu-item">🔗 招待リンクをコピー</button>
      <button id="leaveBtn" class="menu-item danger">🚪 ルームを退出</button>
      <p class="muted small">位置はアプリを開いている間、30分ごとに自動送信されます。画面を消すと止まるので、エイドなど電波のある場所で「今の位置を送信」を押してください。電波がないときに送った内容は、つながった時点で自動送信されます。</p>
      <button id="menuClose" class="btn-ghost">閉じる</button>
    </div>
  </div>

  <!-- 写真ビューア -->
  <div id="photoViewer" class="sheet dark" hidden>
    <div class="viewer">
      <img id="viewerImg" alt="投稿写真">
      <div id="viewerMeta" class="viewer-meta"></div>
      <div class="row center">
        <button id="viewerMap" class="btn-light">📍 撮影地点を地図で見る</button>
        <button id="viewerClose" class="btn-light">閉じる</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
